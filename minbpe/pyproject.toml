[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minbpe"
version = "0.1.0"
description = "Minimal BPE tokenizer (Karpathy), used as tokenizer for Chat_eblan"
requires-python = ">=3.9"
dependencies = ["regex"]

[tool.setuptools]
packages = ["minbpe"]
